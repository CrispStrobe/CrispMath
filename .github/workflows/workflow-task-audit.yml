name: Math problem gap audit
on:
  push:
    branches: ['feat/graph-workspace-ux']
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/diagnostics/**'
      - 'lib/engine/**'
      - 'lib/services/engine_dispatch.dart'
      - 'lib/services/integral_arguments.dart'
      - 'tool/build_web.sh'
      - 'web/workflow_tasks_worker.js'
      - 'test/fixtures/*workflow_tasks.json'
      - 'test/fixtures/new_math_*_tasks.json'
      - 'test/new_math_*_test.dart'
      - 'test/fresh_workflow_tasks_test.dart'
      - 'test/workflow_tasks_test.dart'
      - 'tool/crispmath_cli*'
      - 'tool/check_workflow_tasks_browser.py'
      - '.github/workflows/workflow-task-audit.yml'
  workflow_dispatch:
    inputs:
      linux_runner:
        description: 'GitHub-hosted Linux runner (explicit image for queue fallback)'
        type: choice
        options: [ubuntu-latest, ubuntu-24.04]
        default: ubuntu-latest
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ inputs.linux_runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: 11e6d598521976f38081934106b55095b46b40e3
          path: .ci/CrispEmbed
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get
      - name: Corpus and comparison unit regressions
        run: flutter test --no-pub test/workflow_tasks_test.dart test/fresh_workflow_tasks_test.dart test/new_math_modules_test.dart test/new_math_comparison_test.dart test/new_math_engine_regressions_test.dart test/new_math_numeric_regressions_test.dart test/new_math_document_regressions_test.dart
      - name: Run every task against native app engine (strict)
        run: tool/crispmath_cli.sh --require-native --report task-results/native.json
      - name: Run the fresh independent 50 problems (strict)
        run: tool/crispmath_cli.sh --tasks test/fixtures/fresh_workflow_tasks.json --require-native --report task-results/native-fresh.json
      - name: Run all 100 additional independently drafted problems
        if: ${{ !cancelled() }}
        run: |
          status=0
          for area in algebra numeric workflow; do
            tool/crispmath_cli.sh --tasks "test/fixtures/new_math_${area}_tasks.json" --require-native --report "task-results/native-new-${area}.json" || status=1
          done
          exit "$status"
      - name: Verify exact Taylor compatibility with the native CAS
        run: tool/crispmath_cli.sh --check-series-compatibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-tasks-native
          path: task-results
          retention-days: 14
  browser:
    runs-on: ${{ inputs.linux_runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: 11e6d598521976f38081934106b55095b46b40e3
          path: .ci/CrispEmbed
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get
          python -m pip install -r tool/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build actual app bundle
        run: tool/build_web.sh --release --no-wasm-dry-run -O2
      - name: Run every task against app WASM engine (strict)
        run: |
          python -m http.server 8766 --directory build/web > /tmp/task-audit-http.log 2>&1 &
          python tool/check_workflow_tasks_browser.py --output task-results/browser.json
          python tool/check_workflow_tasks_browser.py --tasks test/fixtures/fresh_workflow_tasks.json --output task-results/browser-fresh.json
      - name: Run all 100 additional problems against the actual WASM worker
        if: ${{ !cancelled() }}
        run: |
          status=0
          for area in algebra numeric workflow; do
            python tool/check_workflow_tasks_browser.py --tasks "test/fixtures/new_math_${area}_tasks.json" --output "task-results/browser-new-${area}.json" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-tasks-browser
          path: task-results
          retention-days: 14
