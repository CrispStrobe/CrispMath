name: macOS App Store

# Mac App Store pipeline for CrispMath. "probe" is read-only: it lists the
# identities inside DIST_CERT_P12_BASE64 and the bundle ID, certificates,
# profiles and macOS versions App Store Connect reports. "validate" builds,
# signs and packages the sandboxed app, ensures the MAC_APP_STORE profile and
# macOS version exist, and runs altool validation. "upload" additionally
# uploads the .pkg for TestFlight; it never submits for App Review.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = read-only; validate = build/sign/validate; upload = also upload'
        type: choice
        options: [probe, validate, upload]
        default: probe

permissions:
  contents: read

concurrency:
  group: macos-appstore
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ inputs.mode == 'probe' }}
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identities in the distribution .p12
        env:
          P12_B64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -eu
          KC="$RUNNER_TEMP/probe.keychain-db"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p probe "$KC"
          security unlock-keychain -p probe "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/productbuild
          echo "-- codesigning identities"; security find-identity -v -p codesigning "$KC"
          echo "-- all identities"; security find-identity -v "$KC"
          security delete-keychain "$KC"; rm -f "$RUNNER_TEMP/dist.p12"
      - name: App Store Connect prerequisites
        env:
          KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          umask 077
          python -m pip install cryptography
          echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/cm.p8"
          python tool/macos_store_probe.py --key-file "$RUNNER_TEMP/cm.p8"
          rm -f "$RUNNER_TEMP/cm.p8"

  package:
    if: ${{ inputs.mode != 'probe' }}
    runs-on: macos-15
    timeout-minutes: 75
    env:
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      DIST_SHA1: 56D3B7D782F2CEF0BBEFEEE30D98C6BA0F31C632
      INSTALLER_SHA1: 36D3723E1FEC754A6037463F19035E988080A67F
      APP: build/macos/Build/Products/Release/crisp_math.app
    steps:
      - uses: actions/checkout@v4
      - name: Checkout CrispEmbed
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: d28ca2ea43a95934d673d1a54177fdf721614ade
          path: .ci/CrispEmbed
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage verified OCR runtime libraries
        run: python tool/stage_ocr_runtime.py --platform macos
      - name: Build macOS release
        run: |
          unset GEM_HOME GEM_PATH GEM_ROOT RUBY_ROOT RUBYOPT RUBY_ENGINE RUBY_VERSION
          flutter pub get
          flutter build macos --release
      - name: Import signing identities into a temp keychain
        env:
          P12_B64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/cm-signing.keychain-db"
          KC_PW="ci-$(uuidgen)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          KEYCHAINS=("$KC")
          while IFS= read -r -d '' keychain; do
            KEYCHAINS+=("$keychain")
          done < <(security list-keychains -d user | python -c 'import shlex,sys; [sys.stdout.buffer.write(p.encode()+b"\0") for p in shlex.split(sys.stdin.read())]')
          security list-keychains -d user -s "${KEYCHAINS[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KC_PW" "$KC" >/dev/null
          security find-identity -v "$KC"
      - name: Ensure Mac App Store profile and macOS version
        env:
          KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python -m pip install cryptography
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          VER=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          python tool/macos_store_prepare.py \
            --key-file "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            --cert-sha1 "$DIST_SHA1" --version "$VER" \
            --profile-out "$RUNNER_TEMP/cm.provisionprofile"
      - name: Sign app inside out with sandbox entitlements
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/cm.provisionprofile" "$APP/Contents/embedded.provisionprofile"
          # Nested code first: loose dylibs, then framework bundles, deepest first.
          find "$APP/Contents" -type f \( -name '*.dylib' -o -name '*.so' \) -print0 |
            xargs -0 -I{} codesign --force --sign "$DIST_SHA1" --timestamp=none {}
          find "$APP/Contents" -type d -name '*.framework' | awk '{print gsub("/","/"), $0}' |
            sort -rn | cut -d' ' -f2- | while IFS= read -r fw; do
              codesign --force --sign "$DIST_SHA1" --timestamp=none "$fw"
            done
          codesign --force --sign "$DIST_SHA1" --timestamp=none \
            --entitlements macos/Runner/AppStore.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP"
      - name: Package signed installer
        run: |
          set -euo pipefail
          productbuild --component "$APP" /Applications --sign "$INSTALLER_SHA1" \
            "$RUNNER_TEMP/CrispMath.pkg"
          pkgutil --check-signature "$RUNNER_TEMP/CrispMath.pkg"
      - name: Validate with App Store Connect
        run: |
          set -euo pipefail
          xcrun altool --validate-app -f "$RUNNER_TEMP/CrispMath.pkg" --type macos \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Upload to App Store Connect
        if: ${{ inputs.mode == 'upload' }}
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          BUILD=$(sed -n 's/^version: .*+//p' pubspec.yaml)
          echo "Uploading macOS $VER (build $BUILD)"
          xcrun altool --upload-package "$RUNNER_TEMP/CrispMath.pkg" --type macos \
            --apple-id "$ASC_APP_ID" --bundle-id com.crispstrobe.crispmath \
            --bundle-version "$BUILD" --bundle-short-version-string "$VER" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8 "$RUNNER_TEMP/cm.provisionprofile"
          security delete-keychain "$RUNNER_TEMP/cm-signing.keychain-db" || true
