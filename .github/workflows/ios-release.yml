name: iOS Release (App Store)

# Builds, signs and uploads the iOS app to App Store Connect from CI.
#
# Until 2026-08-17 CrispMath was the ONLY app on this account with no release
# pipeline — build-ios.yml is an unsigned smoke build, so every TestFlight build
# had to be archived and uploaded by hand from a Mac. This is the same workflow
# the other apps use, adapted; nothing here needs a browser or an Apple ID login.
#
# Triggers:
#   * push a tag matching v*        -> full build + upload (a real release)
#   * manual "Run workflow"         -> choose dry_run=true to build+sign WITHOUT
#                                      uploading (validates signing safely)
#
# Requires these repo secrets (all set via `gh secret set` on 2026-08-17):
#   ASC_API_KEY_P8_BASE64  base64 of AuthKey_<KEYID>.p8
#   ASC_KEY_ID             App Store Connect API key id            (9RMU3C7422)
#   ASC_ISSUER_ID          App Store Connect issuer id
#   ASC_APP_ID             numeric app id                          (6789536359)
#   ASC_TEAM_ID            Apple Developer team id                 (N9XSJ4M3GT)
#   DIST_CERT_P12_BASE64   base64 of the "Apple Distribution" .p12 (cert + key)
#   DIST_CERT_PASSWORD     password for that .p12
#   ASC_PROFILE_BASE64     base64 of the IOS_APP_STORE .mobileprovision
#
# ASC_APP_ID is CrispMath's own 6789536359. altool routes the upload by the
# binary's CFBundleIdentifier, not by --apple-id, so a sibling app's id would
# still upload "successfully" but make every follow-up API query inspect the
# wrong app.
#
# The build number comes from pubspec.yaml (version: x.y.z+BUILD). Bump BUILD
# before tagging, or Apple rejects a duplicate CFBundleVersion -- it does so
# even when the previous build has expired.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build & sign only, do NOT upload'
        type: boolean
        default: true
      validation_run_id:
        description: 'Optional Feature validation run whose browser/gallery must pass before upload'
        type: string
        default: ''
      verify_only:
        description: 'Retry metadata and internal assignment without building or uploading'
        type: boolean
        default: false
      api_runner:
        description: 'Hosted runner for metadata-only checks'
        type: choice
        options: [ubuntu-latest, macos-latest]
        default: ubuntu-latest
      external_testflight:
        description: 'Inspect external beta requirements (requires verify_only)'
        type: boolean
        default: false
      update_beta_description:
        description: 'Correct only en-US beta description (requires verify_only and external_testflight; no submission)'
        type: boolean
        default: false
      submit_external:
        description: 'Submit the verified build to external TestFlight beta review'
        type: boolean
        default: false
      verify_build:
        description: 'Optional uploaded build number; empty uses pubspec'
        type: string
        default: ''
      uploaded_source:
        description: 'Full SHA of the successful upload, required for verify_only'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  BUNDLE_ID: com.crispstrobe.crispmath
  PROFILE_NAME: CrispMath AppStore CI
  FLUTTER_VERSION: '3.44.0'

jobs:
  build-upload:
    if: ${{ inputs.verify_only != true && inputs.external_testflight != true && inputs.submit_external != true && inputs.update_beta_description != true }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned CrispEmbed
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: 78493a31fc3043f3af4ab6fd2f197a32da6f07f0
          path: .ci/CrispEmbed

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disable Swift Package Manager (use pure CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release tooling and internal assignment unit checks
        run: python -m unittest discover -s tool -p '*_test.py'
      - name: Stage verified OCR runtime libraries
        run: python tool/stage_ocr_runtime.py --platform ios

      - name: Resolve dependencies
        run: flutter pub get

      - name: Import signing certificate into a temp keychain
        env:
          P12_B64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/cm-signing.keychain-db"
          KC_PW="ci-$(uuidgen)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          # keep the default (login) keychain on the search list too
          KEYCHAINS=("$KC")
          while IFS= read -r -d '' keychain; do
            KEYCHAINS+=("$keychain")
          done < <(security list-keychains -d user | python -c 'import shlex,sys; [sys.stdout.buffer.write(p.encode()+b"\0") for p in shlex.split(sys.stdin.read())]')
          security list-keychains -d user -s "${KEYCHAINS[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security find-identity -v -p codesigning "$KC"

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.ASC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/cm.mobileprovision"
          # Name the installed file by the profile's UUID and put it in BOTH the
          # legacy dir and the Xcode 16+/26 dir (Xcode moved this location).
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' \
            /dev/stdin <<<"$(security cms -D -i "$RUNNER_TEMP/cm.mobileprovision")")
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$RUNNER_TEMP/cm.mobileprovision" "$DIR/$UUID.mobileprovision"
          done
          echo "installed profile UUID $UUID; name:"
          /usr/libexec/PlistBuddy -c 'Print :Name' \
            /dev/stdin <<<"$(security cms -D -i "$RUNNER_TEMP/cm.mobileprovision")"

      - name: Write App Store Connect API key
        env:
          P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys" .appstoreconnect
          echo "$P8_B64" | base64 --decode > ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          cp ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" "$HOME/.appstoreconnect/private_keys/"

      - name: Write ExportOptions.plist (manual signing)
        run: |
          cat > .appstoreconnect/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.ASC_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${{ env.BUNDLE_ID }}</key><string>${{ env.PROFILE_NAME }}</string></dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Build & sign IPA (xcodebuild, manual signing)
        run: |
          set -euo pipefail
          # Let Flutter generate its ephemeral iOS config (Generated.xcconfig +
          # FlutterGeneratedPluginSwiftPackage) and the CocoaPods integration
          # WITHOUT building — this sets the Flutter.framework search paths that a
          # bare xcodebuild would otherwise miss in the SPM/CocoaPods hybrid.
          #
          # The `env -u GEM_*` scrubbing is the same one build-ios.yml needs: the
          # GitHub runner images preset a Ruby env that makes CocoaPods resolve the
          # wrong gems.
          PATH="/usr/bin:$PATH" flutter build ios --release --config-only --no-codesign
          PATH="/usr/bin:$PATH" env -u GEM_HOME -u GEM_PATH -u GEM_ROOT \
            -u RUBY_ROOT -u RUBYOPT -u RUBY_ENGINE -u RUBY_VERSION \
            pod install --project-directory=ios
          # ARCHIVE UNSIGNED. A bare `xcodebuild archive` insists on an iOS
          # *Development* profile for on-device signing, which CI can't have (only
          # the Distribution cert's private key is available, not a Development
          # one). Skip signing at archive time, then let -exportArchive apply the
          # Distribution signing (imported cert + installed App Store profile) —
          # the standard "sign at export" CI pattern. No account, no dev cert, no
          # -allowProvisioningUpdates (which churns certs and can silently REVOKE
          # the shared Distribution cert for every app on the account).
          PATH="/usr/bin:$PATH" xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean archive
          PATH="/usr/bin:$PATH" xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist .appstoreconnect/ExportOptions.plist
          IPAS=(build/ios/ipa/*.ipa)
          IPA="${IPAS[0]}"
          test -f "$IPA"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "built: $IPA"
          unzip -qo "$IPA" -d /tmp/ipa_check
          codesign --verify --deep --strict --verbose=2 /tmp/ipa_check/Payload/Runner.app 2>&1 | tail -2

      - name: Validate purpose strings in the signed application bundle
        run: |
          VER=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          BUILD=$(sed -n 's/^version: .*+//p' pubspec.yaml)
          python tool/validate_ios_privacy.py /tmp/ipa_check/Payload/Runner.app/Info.plist \
            --version "$VER" --build "$BUILD"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: crispmath-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Wait for live release validation and matching application source
        if: ${{ inputs.validation_run_id != '' && (github.event_name == 'push' || inputs.dry_run == false) }}
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          python tool/wait_release_validation.py \
            --run-id "$VALIDATION_RUN_ID" --package-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/release-validation.json"

      - name: Preserve release validation provenance
        if: ${{ always() && inputs.validation_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-provenance
          path: ${{ runner.temp }}/release-validation.json
          if-no-files-found: ignore

      - name: Upload to App Store Connect
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "Uploading $VER (build $BUILD)"
          xcrun altool --upload-package "$IPA" --type ios \
            --apple-id "${{ secrets.ASC_APP_ID }}" \
            --bundle-id "${{ env.BUNDLE_ID }}" \
            --bundle-version "$BUILD" \
            --bundle-short-version-string "$VER" \
            --api-key "${{ secrets.ASC_KEY_ID }}" \
            --api-issuer "${{ secrets.ASC_ISSUER_ID }}"

      - name: Verify processing and existing internal TestFlight assignment
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python -m pip install cryptography
          VER=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          BUILD=$(sed -n 's/^version: .*+//p' pubspec.yaml)
          python tool/testflight_internal.py \
            --key-file ".appstoreconnect/AuthKey_${ASC_KEY_ID}.p8" \
            --version "$VER" --build "$BUILD"

      - name: Retain internal TestFlight evidence
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: internal-testflight-evidence
          path: testflight-evidence.json
          if-no-files-found: error

  verify-upload:
    if: ${{ inputs.verify_only == true || inputs.update_beta_description == true }}
    runs-on: ${{ inputs.api_runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_SOURCE: ${{ inputs.uploaded_source }}
      VERIFY_BUILD: ${{ inputs.verify_build }}
      UPDATE_BETA_DESCRIPTION: ${{ inputs.update_beta_description }}
      VERIFY_ONLY: ${{ inputs.verify_only }}
      EXTERNAL_TESTFLIGHT: ${{ inputs.external_testflight }}
      SUBMIT_EXTERNAL: ${{ inputs.submit_external }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies and release-tool unit checks
        run: |
          test "${#BUILD_SOURCE}" -eq 40
          if [ "$UPDATE_BETA_DESCRIPTION" = true ]; then
            test "$VERIFY_ONLY" = true
            test "$EXTERNAL_TESTFLIGHT" = true
            test "$SUBMIT_EXTERNAL" != true
          fi
          python -m pip install cryptography
          python -m unittest discover -s tool -p '*_test.py'
      - name: Prepare temporary private API key
        env:
          KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          umask 077
          echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/cm-testflight.p8"
      - name: Read actual processing state
        run: python tool/testflight_internal.py --key-file "$RUNNER_TEMP/cm-testflight.p8" --inspect-only --output processing-state.json
      - uses: actions/upload-artifact@v4
        with:
          name: testflight-processing-snapshot
          path: processing-state.json
      - name: External TestFlight inspection or submission
        if: ${{ inputs.external_testflight == true }}
        env:
          SUBMIT_EXTERNAL: ${{ inputs.submit_external }}
        run: |
          VER=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          BUILD="${VERIFY_BUILD:-$(sed -n 's/^version: .*+//p' pubspec.yaml)}"
          ARGS=()
          if [ "$SUBMIT_EXTERNAL" = true ]; then ARGS+=(--submit); fi
          if [ "$UPDATE_BETA_DESCRIPTION" = true ]; then ARGS+=(--update-english-description); fi
          python tool/testflight_external.py --key-file "$RUNNER_TEMP/cm-testflight.p8" \
            --version "$VER" --build "$BUILD" "${ARGS[@]}"
      - name: Retain external TestFlight evidence
        if: ${{ always() && inputs.external_testflight == true }}
        uses: actions/upload-artifact@v4
        with:
          name: external-testflight-evidence
          path: external-testflight-evidence.json
          if-no-files-found: error
      - name: Retry internal assignment
        if: ${{ inputs.external_testflight != true }}
        run: |
          VER=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          BUILD="${VERIFY_BUILD:-$(sed -n 's/^version: .*+//p' pubspec.yaml)}"
          python tool/testflight_internal.py --key-file "$RUNNER_TEMP/cm-testflight.p8" \
            --version "$VER" --build "$BUILD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-testflight-status
          path: testflight-evidence.json
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/cm-testflight.p8"
