name: App Store review submission

# Inspects, or submits, an uploaded and VALID iOS build for App Store review.
# Inspection (the default) changes nothing. Submission reuses the editable
# App Store version, attaches the build, writes the App Review notes from
# tool/app_review_submit.py and submits. Dispatch only with the owner's
# explicit authorization for that build.

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Uploaded build number (CFBundleVersion)'
        type: string
        required: true
      submit:
        description: 'Submit for App Review (otherwise inspect only)'
        type: boolean
        default: false
      replace_in_review:
        description: 'Withdraw the version currently in review first (requires submit)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_SOURCE: ${{ github.sha }}
      BUILD: ${{ inputs.build }}
      SUBMIT: ${{ inputs.submit }}
      REPLACE: ${{ inputs.replace_in_review }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies and release-tool unit checks
        run: |
          python -m pip install cryptography
          python -m unittest discover -s tool -p '*_test.py'
      - name: Prepare temporary private API key
        env:
          KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          umask 077
          echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/cm-review.p8"
      - name: Inspect or submit
        run: |
          VER=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          ARGS=()
          if [ "$SUBMIT" = true ]; then ARGS+=(--submit); fi
          if [ "$REPLACE" = true ]; then
            test "$SUBMIT" = true
            ARGS+=(--replace-in-review)
          fi
          python tool/app_review_submit.py --key-file "$RUNNER_TEMP/cm-review.p8" \
            --version "$VER" --build "$BUILD" "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-review-evidence
          path: app-review-evidence.json
          if-no-files-found: ignore
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/cm-review.p8"
