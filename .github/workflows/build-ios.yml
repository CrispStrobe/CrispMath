# iOS smoke build (unsigned). Verifies the bridge plugin builds and links
# for iOS too. The output is *not* installable on a device — that requires
# Apple Developer signing, which lives outside CI. The point is to catch
# Swift/Obj-C / podspec / xcframework regressions before they hit users.

name: Build iOS

on:
  push:
    branches: [main, latex-input-field]
  pull_request:
    branches: [main, latex-input-field]
  workflow_dispatch:
    inputs:
      macos_runner:
        description: 'GitHub-hosted macOS image (queue fallback)'
        type: choice
        options: [macos-15, macos-latest]
        default: macos-15

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Validate calculator history file type
        run: python3 test/ios_history_uti_test.py

      - name: Checkout CrispEmbed
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: d28ca2ea43a95934d673d1a54177fdf721614ade
          path: .ci/CrispEmbed

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage verified OCR runtime libraries
        run: python tool/stage_ocr_runtime.py --platform ios

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS (release, unsigned)
        # See build-macos.yml — same CocoaPods env conflict on GH runners.
        run: |
          unset GEM_HOME GEM_PATH GEM_ROOT RUBY_ROOT RUBYOPT RUBY_ENGINE RUBY_VERSION
          flutter build ios --release --no-codesign

      - name: Zip the Runner.app
        run: |
          cd build/ios/iphoneos
          zip -ryq ../../../crisp_math-ios-unsigned.zip Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: crisp_math-ios-unsigned
          path: crisp_math-ios-unsigned.zip
          retention-days: 14
