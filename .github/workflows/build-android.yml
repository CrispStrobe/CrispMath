# Android smoke build. Same caveat as Linux/Windows — symbolic_math_bridge
# is iOS/macOS only, so the Android app runs in degraded mode.
# Output: a debug APK (unsigned). Users can sideload via adb.

name: Build Android

on:
  push:
    branches: [main, latex-input-field]
  pull_request:
    branches: [main, latex-input-field]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Report runner disk before Android setup
        run: |
          df -h "$GITHUB_WORKSPACE"
          df -i "$GITHUB_WORKSPACE"

      - name: Checkout CrispEmbed
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: 78493a31fc3043f3af4ab6fd2f197a32da6f07f0
          path: .ci/CrispEmbed

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage verified OCR runtime libraries
        run: python tool/stage_ocr_runtime.py --platform android

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Report runner disk after Android build
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          df -i "$GITHUB_WORKSPACE"
          du -sh /usr/share/dotnet "$ANDROID_HOME" "$HOME/.gradle" "$GITHUB_WORKSPACE" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: crisp_math-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
