# Linux smoke build. The SymEngine bridge plugin only supports iOS/macOS,
# so on Linux the FFI lookup fails and CalculatorEngine falls back to
# returning "Error: <op> requires native library" for any symbolic call.
# The UI, persistence, plot rendering, plane/conic analysis, and the
# pure-Dart vector/tensor math all work. We document the limitation
# instead of failing the build.

name: Build Linux

on:
  push:
    branches: [main, latex-input-field]
  pull_request:
    branches: [main, latex-input-field]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Checkout CrispEmbed
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: 11e6d598521976f38081934106b55095b46b40e3
          path: .ci/CrispEmbed

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test OCR runtime staging
        run: python -m unittest discover -s tool -p stage_ocr_runtime_test.py

      - name: Stage OCR runtime libraries
        run: python tool/stage_ocr_runtime.py --platform linux

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Provision OCR test model
        shell: bash
        run: |
          mkdir -p .ci/ocr-model
          curl -fL --retry 3 https://huggingface.co/cstr/pix2tex-mfr-gguf/resolve/main/pix2tex-mfr-q4_k.gguf -o .ci/ocr-model/pix2tex-mfr-q4_k.gguf
          echo '8957d1ec5d1f5983fbdd5f6e819203d7c32079f379563eb61f518221c8c5bdd6  .ci/ocr-model/pix2tex-mfr-q4_k.gguf' | sha256sum -c -

      - name: Verify bundled native dependencies
        run: |
          ldd build/linux/x64/release/bundle/lib/libcrispembed.so | tee .ci/ocr-dependencies.txt
          if grep -q 'not found' .ci/ocr-dependencies.txt; then exit 1; fi

      - name: Recognize an image using the packaged OCR runtime
        env:
          CRISPMATH_OCR_APP_EXECUTABLE: build/linux/x64/release/bundle/crisp_math
          CRISPMATH_OCR_MODEL: .ci/ocr-model/pix2tex-mfr-q4_k.gguf
          CRISPMATH_OCR_LIBRARY: build/linux/x64/release/bundle/lib/libcrispembed.so
        run: flutter test --no-pub --reporter expanded native_test/ocr_native_test.dart

      - name: Tar the bundle
        run: |
          cd build/linux/x64/release/
          tar czf ../../../../crisp_math-linux-x64.tar.gz bundle

      - uses: actions/upload-artifact@v4
        with:
          name: crisp_math-linux-x64
          path: crisp_math-linux-x64.tar.gz
          retention-days: 14
