# macOS smoke build — runs on PRs and pushes to main. Builds in release
# to exercise the same link path that HISTORY round 13 fixed (the
# bridge's +load asm-clobber keep-alive lives in the plugin and can
# regress when we bump the bridge ref). After the build, we verify
# 45+ flutter_symengine_* symbols actually landed in the binary, then
# run the headless matrix diagnostic to confirm the FFI matrix path
# round-trips end-to-end. The resulting unsigned .app is uploaded as a
# build artifact so reviewers can grab and run it locally.

name: Build macOS

on:
  push:
    branches: [main, latex-input-field]
  pull_request:
    branches: [main, latex-input-field]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Checkout CrispEmbed
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: 11e6d598521976f38081934106b55095b46b40e3
          path: .ci/CrispEmbed

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage verified OCR runtime libraries
        run: python tool/stage_ocr_runtime.py --platform macos

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build macOS (release, unsigned)
        # GitHub macOS runners ship preset GEM_HOME / GEM_PATH that point at
        # a stale gem cache; CocoaPods refuses to start. We `unset` them
        # inline rather than via `env:` (empty strings still trip rubygems).
        run: |
          unset GEM_HOME GEM_PATH GEM_ROOT RUBY_ROOT RUBYOPT RUBY_ENGINE RUBY_VERSION
          flutter build macos --release

      - name: Verify SymEngine symbols are linked
        # Scan every Mach-O in the .app bundle. Different Flutter versions
        # put the Dart VM in different files, so we just look everywhere
        # instead of guessing a single path. Release builds with the bridge
        # ref from HISTORY round 13 land all 45 flutter_symengine_* symbols
        # in the main binary; we threshold at >= 30 to leave room for the
        # bridge to grow without making CI brittle.
        run: |
          set -eu
          APP="build/macos/Build/Products/Release/crisp_math.app"
          ls -la "$APP/Contents/MacOS"
          TOTAL=0
          while IFS= read -r -d '' bin; do
            count=$(nm "$bin" 2>/dev/null | grep -c flutter_symengine || true)
            if [ "$count" -gt 0 ]; then
              echo "  $bin: $count"
              TOTAL=$((TOTAL + count))
            fi
          done < <(find "$APP" -type f -perm -u+x -print0)
          echo "Total SymEngine symbols across bundle: $TOTAL"
          if [ "$TOTAL" -lt 30 ]; then
            echo "::error::Expected >= 30 SymEngine symbols across bundle, found $TOTAL"
            exit 1
          fi

      - name: Run matrix self-test against the release binary
        # Headless invocation of the matrix diagnostic battery (det / inv /
        # transpose / + / * across 2x2 and 3x3). Confirms the FFI matrix
        # bindings actually round-trip, not just that the symbols are
        # statically present. The binary exits non-zero on any failure.
        run: |
          set -eu
          BIN="build/macos/Build/Products/Release/crisp_math.app/Contents/MacOS/crisp_math"
          CRISPMATH_DIAGNOSTIC=matrix "$BIN"

      - name: Run step engine self-test against the release binary
        # Headless invocation of the step-by-step diagnostic battery
        # (diff / integrate / solve with ~28 examples). Confirms the
        # step engine's recursive rule walker produces canonical
        # answers that match SymEngine, and catches regressions when
        # SymEngine's output format shifts between bridge versions.
        run: |
          set -eu
          BIN="build/macos/Build/Products/Release/crisp_math.app/Contents/MacOS/crisp_math"
          CRISPMATH_DIAGNOSTIC=steps "$BIN"

      - name: Verify exact Taylor compatibility against the release binary
        run: |
          set -eu
          BIN="build/macos/Build/Products/Release/crisp_math.app/Contents/MacOS/crisp_math"
          CRISPMATH_DIAGNOSTIC=series "$BIN"

      - name: Run strict 50-task audit against the packaged native app
        # The release app keeps its sandbox: use inherited pipes rather than
        # granting it access to arbitrary files in the runner's workspace.
        run: |
          set -euo pipefail
          mkdir -p task-results
          BIN="build/macos/Build/Products/Release/crisp_math.app/Contents/MacOS/crisp_math"
          cat test/fixtures/workflow_tasks.json | \
            CRISPMATH_DIAGNOSTIC=workflows CRISPMATH_TASKS_FILE=- \
            CRISPMATH_TASK_REPORT=- "$BIN" 2>&1 | tee task-results/macos.log

      - name: Extract and verify the packaged-app audit report
        if: always()
        run: python tool/extract_workflow_report.py --log task-results/macos.log --output task-results/macos.json

      - name: Run the fresh 50 problems against the packaged native app
        run: |
          set -euo pipefail
          BIN="build/macos/Build/Products/Release/crisp_math.app/Contents/MacOS/crisp_math"
          cat test/fixtures/fresh_workflow_tasks.json | \
            CRISPMATH_DIAGNOSTIC=workflows CRISPMATH_TASKS_FILE=- \
            CRISPMATH_TASK_REPORT=- "$BIN" 2>&1 | tee task-results/macos-fresh.log
          python tool/extract_workflow_report.py --log task-results/macos-fresh.log --output task-results/macos-fresh.json

      - name: Run the 100 additional problems against the packaged native app
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          mkdir -p task-results
          BIN="build/macos/Build/Products/Release/crisp_math.app/Contents/MacOS/crisp_math"
          status=0
          for area in algebra numeric workflow; do
            count=40
            if [ "$area" = workflow ]; then count=20; fi
            cat "test/fixtures/new_math_${area}_tasks.json" | \
              CRISPMATH_DIAGNOSTIC=workflows CRISPMATH_TASKS_FILE=- \
              CRISPMATH_TASK_REPORT=- "$BIN" 2>&1 | tee "task-results/macos-new-${area}.log" || status=1
            python tool/extract_workflow_report.py --log "task-results/macos-new-${area}.log" --output "task-results/macos-new-${area}.json" --expected-count "$count" || status=1
          done
          exit "$status"

      - name: Run round two independent 100 problems against the packaged native app
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          mkdir -p task-results
          BIN="build/macos/Build/Products/Release/crisp_math.app/Contents/MacOS/crisp_math"
          status=0
          for area in algebra numeric workflow native_safety; do
            count=40
            if [ "$area" = workflow ]; then count=20; fi
            if [ "$area" = native_safety ]; then count=4; fi
            cat "test/fixtures/round2_${area}_tasks.json" | \
              CRISPMATH_DIAGNOSTIC=workflows CRISPMATH_TASKS_FILE=- \
              CRISPMATH_TASK_REPORT=- "$BIN" 2>&1 | tee "task-results/macos-round2-${area}.log" || status=1
            python tool/extract_workflow_report.py --log "task-results/macos-round2-${area}.log" --output "task-results/macos-round2-${area}.json" --expected-count "$count" || status=1
          done
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-tasks-macos
          path: task-results
          if-no-files-found: ignore

      - name: Provision OCR test model
        run: |
          mkdir -p .ci/ocr-model
          curl -fL --retry 3 https://huggingface.co/cstr/pix2tex-mfr-gguf/resolve/main/pix2tex-mfr-q4_k.gguf -o .ci/ocr-model/pix2tex-mfr-q4_k.gguf
          echo '8957d1ec5d1f5983fbdd5f6e819203d7c32079f379563eb61f518221c8c5bdd6  .ci/ocr-model/pix2tex-mfr-q4_k.gguf' | shasum -a 256 -c -

      - name: Recognize an image using the packaged OCR runtime
        env:
          CRISPMATH_OCR_APP_EXECUTABLE: build/macos/Build/Products/Release/crisp_math.app/Contents/MacOS/crisp_math
          CRISPMATH_OCR_MODEL: .ci/ocr-model/pix2tex-mfr-q4_k.gguf
          CRISPMATH_OCR_LIBRARY: build/macos/Build/Products/Release/crisp_math.app/Contents/Frameworks/libcrispembed.0.dylib
        run: flutter test --no-pub --reporter expanded native_test/ocr_native_test.dart

      - name: Zip the .app for download
        run: |
          cd build/macos/Build/Products/Release
          zip -ryq ../../../../../crisp_math-macos-release.zip crisp_math.app

      - uses: actions/upload-artifact@v4
        with:
          name: crisp_math-macos-release
          path: crisp_math-macos-release.zip
          retention-days: 14
