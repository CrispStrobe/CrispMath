name: Feature validation
on:
  push:
    branches: ['feat/graph-workspace-ux']
  workflow_dispatch:
    inputs:
      checks_only:
        description: 'Run analysis and focused regressions; use separate unit/browser runs'
        type: boolean
        default: false
      browser_only:
        description: 'Run browser and gallery checks without repeating unchanged unit suites'
        type: boolean
        default: false
      desktop_runner:
        description: 'Hosted runner for unit, analysis and browser validation'
        type: choice
        options: [auto, macos-latest]
        default: auto
      math_audit:
        description: 'Validate math changes; skip the unchanged OCR model benchmark'
        type: boolean
        default: false
      linux_runner:
        description: 'GitHub-hosted Linux runner (explicit image for queue fallback)'
        type: choice
        options: [ubuntu-latest, ubuntu-24.04]
        default: ubuntu-latest
      probe_build_run_id:
        description: 'Optional existing feature-web run ID: run only the fast batch browser probe'
        type: string
        default: ''
      probe_math_scope:
        description: 'Probe solve scoping through the immutable app UI instead of batch editing'
        type: boolean
        default: false
      probe_clip_labels:
        description: 'Diagnostic only: inject semantic-label clipping into that older bundle'
        type: boolean
        default: false
      probe_performance:
        description: 'Also benchmark the immutable bundle and apply the release latency gate'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: feature-validation-${{ github.ref }}-${{ inputs.checks_only && 'checks-only' || inputs.browser_only && 'browser-only' || inputs.probe_build_run_id || 'full' }}
  cancel-in-progress: true
jobs:
  features:
    if: ${{ !inputs.probe_build_run_id && !inputs.browser_only }}
    runs-on: ${{ inputs.desktop_runner != 'auto' && inputs.desktop_runner || inputs.linux_runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: 11e6d598521976f38081934106b55095b46b40e3
          path: .ci/CrispEmbed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get
      - name: Analyze entire application
        run: flutter analyze --no-pub
      - name: Feature and optimization regression tests
        run: >-
          flutter test --concurrency=2 --reporter expanded
          test/apple_workflow_test.dart test/apple_keyboard_test.dart test/worksheet_bundle_test.dart test/document_history_test.dart test/cloud_backup_store_test.dart test/handwriting_workflow_test.dart
          test/native_bridge_wiring_test.dart test/ocr_library_path_test.dart
          test/graph_inspection_test.dart test/graph_inspection_widget_test.dart test/graph_touch_trace_test.dart
          test/linked_graph_test.dart test/graph_parameter_cleanup_test.dart
          test/command_palette_test.dart test/graph_viewport_test.dart
          test/graph_navigation_widget_test.dart test/graph_painter_repaint_test.dart
          test/graphing_plot_modes_test.dart test/graph_sampling_test.dart
          test/ai_provider_service_test.dart test/ai_math_dialog_test.dart
          test/notepad_screen_test.dart test/app_state_persistence_test.dart
          test/symbolic_taylor_test.dart test/result_evidence_test.dart test/workflow_tasks_test.dart test/fresh_workflow_tasks_test.dart test/integral_arguments_test.dart
          test/notepad_functions_test.dart test/notepad_batch_test.dart test/notepad_scope_cache_test.dart test/notepad_activity_test.dart
          test/selected_listenable_builder_test.dart test/notepad_dispatcher_test.dart
          test/round4_algebra_regressions_test.dart test/round4_numeric_regressions_test.dart test/round4_worksheet_scope_test.dart test/round5_reference_tasks_test.dart test/round6_reference_tasks_test.dart test/round7_reference_tasks_test.dart test/round7_precision_regressions_test.dart test/round7_algebra_regressions_test.dart test/round7_numeric_regressions_test.dart test/round6_exact_rounding_test.dart test/round6_numeric_regressions_test.dart test/round6_constraint_regressions_test.dart test/round6_algebra_regressions_test.dart test/round6_worksheet_regressions_test.dart test/round6_series_routing_test.dart test/round5_numeric_regressions_test.dart test/round5_operation_scope_test.dart
  unit:
    if: ${{ !inputs.probe_build_run_id && !inputs.browser_only && !inputs.checks_only }}
    runs-on: ${{ inputs.desktop_runner != 'auto' && inputs.desktop_runner || inputs.linux_runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: 11e6d598521976f38081934106b55095b46b40e3
          path: .ci/CrispEmbed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get
      - name: Profiling and release-tool unit tests
        run: python -m unittest discover -s tool -p '*_test.py'
      - name: Unit and widget tests
        run: flutter test --concurrency=2 --reporter expanded
      - name: Profile dependency evaluator separately
        run: dart tool/benchmark_notepad.dart > notepad-evaluator-profile.json
      - uses: actions/upload-artifact@v4
        with:
          name: notepad-evaluator-profile
          path: notepad-evaluator-profile.json
  native-ocr:
    if: ${{ !inputs.probe_build_run_id && !inputs.browser_only && !inputs.checks_only && inputs.math_audit != true }}
    runs-on: ${{ inputs.linux_runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: 11e6d598521976f38081934106b55095b46b40e3
          path: .ci/CrispEmbed
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get
      - name: Build native OCR library
        run: |
          cmake -S .ci/CrispEmbed -B .ci/ocr-build -DCMAKE_BUILD_TYPE=Release -DCRISPEMBED_BUILD_SHARED=ON -DGGML_NATIVE=OFF -DGGML_BLAS=OFF
          cmake --build .ci/ocr-build --target crispembed-shared --parallel 2
      - name: Provision printed math model
        run: |
          curl --fail --location --retry 3 https://huggingface.co/cstr/pix2tex-mfr-gguf/resolve/main/pix2tex-mfr-q4_k.gguf --output .ci/pix2tex-mfr-q4_k.gguf
          echo "8957d1ec5d1f5983fbdd5f6e819203d7c32079f379563eb61f518221c8c5bdd6  .ci/pix2tex-mfr-q4_k.gguf" | sha256sum --check
      - name: Provision scored OCR corpus
        run: |
          python3 -m pip install -r tool/inference-requirements.txt
          python3 tool/provision_ocr_quality.py
      - name: Recognize committed image and evaluate exactly
        run: |
          export CRISPMATH_OCR_MODEL="$PWD/.ci/pix2tex-mfr-q4_k.gguf"
          export CRISPMATH_OCR_LIBRARY="$PWD/.ci/ocr-build/libcrispembed.so"
          flutter test --reporter expanded native_test/ocr_native_test.dart native_test/ocr_quality_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ocr-quality
          path: |
            .dart_tool/inference/ocr-quality.json
            .dart_tool/inference/ocr-corpus/NOTICE.txt
          retention-days: 14
  browser:
    if: ${{ !inputs.probe_build_run_id && !inputs.checks_only }}
    runs-on: ${{ inputs.desktop_runner != 'auto' && inputs.desktop_runner || inputs.linux_runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: 11e6d598521976f38081934106b55095b46b40e3
          path: .ci/CrispEmbed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get
      - name: Build release preview
        run: tool/build_web.sh --release --no-wasm-dry-run -O2
      - uses: actions/upload-artifact@v4
        with:
          name: feature-web
          path: build/web
          retention-days: 7

      - name: Install browser test tools
        run: |
          python -m pip install -r tool/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Live browser feature checks
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory build/web > /tmp/crispmath-http.log 2>&1 &
          curl --fail --silent --show-error --noproxy '*' --retry 30 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:8766/privacy.html > /dev/null
          python tool/ai_contract_fixture.py > /tmp/crispmath-ai-fixture.log 2>&1 &
          curl --fail --silent --show-error --noproxy '*' --retry 30 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:8769/requests > /dev/null
          python tool/check_feature_browser.py --stage "$(cat tool/feature_stage)" --screenshots browser-results
          python tool/check_mobile_trace.py --screenshots browser-results
          python tool/check_catalog_browser.py --screenshots browser-results
          python tool/check_core_workflow_browser.py
          python tool/check_notepad_calendar_browser.py
          python tool/check_result_evidence_browser.py
          python tool/check_integral_syntax_browser.py
          python tool/check_notepad_batch_browser.py
          python tool/check_notepad_functions_browser.py
          python tool/check_apple_workflows_browser.py
          python tool/check_worksheet_export_browser.py
          python tool/check_document_history_browser.py
          python tool/check_handwriting_browser.py
          python tool/check_fresh_calculations_browser.py
          python tool/check_new_math_browser.py
          python tool/check_release_browser.py --results browser-results/release
          python tool/benchmark_workflows.py --trials 3 --source "$GITHUB_SHA" --output browser-results/workflow-performance.json
          python tool/check_workflow_performance.py --report browser-results/workflow-performance.json
      - name: Debug build and framework assertion checks
        run: |
          tool/build_web.sh --debug --no-wasm-dry-run
          python tool/check_feature_browser.py --stage "$(cat tool/feature_stage)" --screenshots browser-results
          python tool/check_mobile_trace.py --screenshots browser-results/debug
          python tool/check_catalog_browser.py --screenshots browser-results/debug
          python tool/check_notepad_calendar_browser.py --output browser-results/debug/calendar-routing.json
          python tool/check_result_evidence_browser.py --output browser-results/debug/provenance
          python tool/check_integral_syntax_browser.py --output browser-results/debug/integral-syntax
          python tool/check_notepad_batch_browser.py --rows 200 --cas-every 1 --output browser-results/debug/notepad-batch
          python tool/check_notepad_functions_browser.py --output browser-results/debug/notepad-functions
          python tool/check_apple_workflows_browser.py --output browser-results/debug/apple-workflows
          python tool/check_worksheet_export_browser.py --output browser-results/debug/worksheet-export
          python tool/check_document_history_browser.py --output browser-results/debug/document-history
          python tool/check_handwriting_browser.py --output browser-results/debug/handwriting
          python tool/check_fresh_calculations_browser.py --output browser-results/debug/fresh-calculations
          python tool/check_new_math_browser.py --output browser-results/debug/new-math
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: browser-results
          if-no-files-found: ignore

  gallery:
    needs: browser
    runs-on: ${{ inputs.desktop_runner != 'auto' && inputs.desktop_runner || inputs.linux_runner || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: feature-web
          path: gallery-web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install screenshot tools
        run: |
          python -m pip install -r tool/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Capture verified workflow gallery
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory gallery-web > /tmp/gallery-http.log 2>&1 &
          curl --fail --silent --show-error --noproxy '*' --retry 30 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:8766/privacy.html > /dev/null
          python tool/capture_product_gallery.py --source "$GITHUB_SHA" --output product-gallery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-gallery
          path: product-gallery
          retention-days: 14

  batch-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_build_run_id != '' }}
    runs-on: ${{ inputs.linux_runner || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Identify immutable app source
        id: app-source
        env:
          BUILD_RUN_ID: ${{ inputs.probe_build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          APP_SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .head_sha)
          echo "source=$APP_SOURCE" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: feature-web
          run-id: ${{ inputs.probe_build_run_id }}
          github-token: ${{ github.token }}
          path: build/web
      - name: Install browser test tools
        run: |
          python -m pip install -r tool/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Probe actual batch UI
        if: ${{ inputs.probe_math_scope != true }}
        env:
          APP_SOURCE: ${{ steps.app-source.outputs.source }}
          CLIP_LABELS: ${{ inputs.probe_clip_labels }}
          PROBE_PERFORMANCE: ${{ inputs.probe_performance }}
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory build/web > /tmp/crispmath-http.log 2>&1 &
          curl --fail --silent --show-error --noproxy '*' --retry 30 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:8766/privacy.html > /dev/null
          python tool/check_deployed_bundle.py --url http://localhost:8766/ --source "$APP_SOURCE"
          PROBE_ARGS=()
          if [ "$CLIP_LABELS" = "true" ]; then PROBE_ARGS+=(--label-clip-probe); fi
          python tool/check_notepad_batch_browser.py "${PROBE_ARGS[@]}" --output browser-results/batch-probe
          if [ "$PROBE_PERFORMANCE" = "true" ]; then
            if [ "$CLIP_LABELS" = "true" ]; then echo "Performance requires an unmodified app bundle" >&2; exit 1; fi
            python tool/benchmark_workflows.py --trials 3 --source "$APP_SOURCE" --output browser-results/workflow-performance.json
            python tool/check_workflow_performance.py --report browser-results/workflow-performance.json
          fi
      - name: Probe actual solve scope UI
        if: ${{ inputs.probe_math_scope == true }}
        env:
          APP_SOURCE: ${{ steps.app-source.outputs.source }}
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory build/web > /tmp/crispmath-http.log 2>&1 &
          curl --fail --silent --show-error --noproxy '*' --retry 30 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:8766/privacy.html > /dev/null
          python tool/check_deployed_bundle.py --url http://localhost:8766/ --source "$APP_SOURCE"
          python tool/check_round5_solve_browser.py --expected-source "$APP_SOURCE" --output browser-results/solve-scope
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-probe-results
          path: browser-results
          retention-days: 7
