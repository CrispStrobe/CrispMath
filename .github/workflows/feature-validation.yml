name: Feature validation
on:
  push:
    branches: ['feat/graph-workspace-ux']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feature-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          path: .ci/CrispEmbed
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get
      - name: Analyze new feature files
        run: >-
          flutter analyze --no-pub
          lib/engine/command_catalog.dart lib/engine/graph_viewport.dart
          lib/services/ai_provider_service.dart lib/widgets/command_palette.dart
          lib/widgets/ai_math_dialog.dart
      - name: Feature and optimization regression tests
        run: >-
          flutter test --concurrency=2 --reporter expanded
          test/graph_inspection_test.dart test/graph_inspection_widget_test.dart test/graph_touch_trace_test.dart
          test/linked_graph_test.dart test/graph_parameter_cleanup_test.dart
          test/command_palette_test.dart test/graph_viewport_test.dart
          test/graph_navigation_widget_test.dart test/graph_painter_repaint_test.dart
          test/graphing_plot_modes_test.dart test/graph_sampling_test.dart
          test/ai_provider_service_test.dart test/ai_math_dialog_test.dart
          test/notepad_screen_test.dart test/app_state_persistence_test.dart
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          path: .ci/CrispEmbed
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get
      - name: Unit and widget tests
        run: flutter test --concurrency=2 --reporter expanded
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 527aa1690057f78dee8a9cf64300de29246e0517
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          path: .ci/CrispEmbed
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get
      - name: Verify existing catalog and legacy failures at original main
        run: >-
          flutter test --concurrency=2 --reporter expanded
          test/worked_examples_test.dart test/worked_examples_localization_test.dart
          test/unit_catalog_test.dart test/unit_expression_test.dart
          test/matrix_evaluator_test.dart
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          path: .ci/CrispEmbed
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get
      - name: Build release preview
        run: tool/build_web.sh --release --no-wasm-dry-run -O2
      - uses: actions/upload-artifact@v4
        with:
          name: feature-web
          path: build/web
          retention-days: 7

      - name: Install browser test tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Live browser feature checks
        run: |
          python -m http.server 8766 --directory build/web > /tmp/crispmath-http.log 2>&1 &
          python tool/ai_contract_fixture.py > /tmp/crispmath-ai-fixture.log 2>&1 &
          python tool/check_feature_browser.py --stage "$(cat tool/feature_stage)" --screenshots browser-results
          python tool/check_mobile_trace.py --screenshots browser-results
      - name: Debug build and framework assertion checks
        run: |
          tool/build_web.sh --debug --no-wasm-dry-run
          python tool/check_feature_browser.py --stage "$(cat tool/feature_stage)" --screenshots browser-results
          python tool/check_mobile_trace.py --screenshots browser-results/debug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: browser-results
          if-no-files-found: ignore
