name: Feature validation
on:
  push:
    branches: ['feat/graph-workspace-ux']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feature-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          path: .ci/CrispEmbed
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get
      - name: Unit and widget tests
        run: flutter test --concurrency=2 --reporter expanded
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          path: .ci/CrispEmbed
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get
      - name: Build release preview
        run: tool/build_web.sh --release --no-wasm-dry-run -O2
      - uses: actions/upload-artifact@v4
        with:
          name: feature-web
          path: build/web
          retention-days: 7

      - name: Install browser test tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Live browser feature checks
        run: |
          python -m http.server 8766 --directory build/web > /tmp/crispmath-http.log 2>&1 &
          python tool/check_feature_browser.py --stage "$(cat tool/feature_stage)" --screenshots browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: browser-results
          if-no-files-found: ignore
