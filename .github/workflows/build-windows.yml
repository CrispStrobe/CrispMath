# Windows smoke build. Same caveat as Linux: SymEngine bridge isn't
# available on Windows, so the calculator runs in degraded mode (UI
# works, symbolic operations return error strings). Producing a build
# artifact lets Windows users try the calculator and gives us a CI
# safety net against regressions in the Flutter-Windows pipeline.

name: Build Windows

on:
  push:
    branches: [main, latex-input-field]
  pull_request:
    branches: [main, latex-input-field]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Checkout CrispEmbed
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: 11e6d598521976f38081934106b55095b46b40e3
          path: .ci/CrispEmbed

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test OCR runtime staging
        run: python -m unittest discover -s tool -p stage_ocr_runtime_test.py

      - name: Stage OCR runtime libraries
        run: python tool/stage_ocr_runtime.py --platform windows

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Provision OCR test model
        shell: bash
        run: |
          mkdir -p .ci/ocr-model
          curl -fL --retry 3 https://huggingface.co/cstr/pix2tex-mfr-gguf/resolve/main/pix2tex-mfr-q4_k.gguf -o .ci/ocr-model/pix2tex-mfr-q4_k.gguf
          echo '8957d1ec5d1f5983fbdd5f6e819203d7c32079f379563eb61f518221c8c5bdd6  .ci/ocr-model/pix2tex-mfr-q4_k.gguf' | sha256sum -c -

      - name: Add bundled libraries to test process lookup
        run: |
          (Resolve-Path build/windows/x64/runner/Release).Path >> $env:GITHUB_PATH

      - name: Recognize an image using the packaged OCR runtime
        env:
          CRISPMATH_OCR_APP_EXECUTABLE: build/windows/x64/runner/Release/crisp_math.exe
          CRISPMATH_OCR_MODEL: .ci/ocr-model/pix2tex-mfr-q4_k.gguf
          CRISPMATH_OCR_LIBRARY: build/windows/x64/runner/Release/crispembed.dll
        run: flutter test --no-pub --reporter expanded native_test/ocr_native_test.dart

      - name: Zip the bundle
        run: |
          cd build\windows\x64\runner\Release
          Compress-Archive -Path * -DestinationPath ..\..\..\..\..\crisp_math-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: crisp_math-windows-x64
          path: crisp_math-windows-x64.zip
          retention-days: 14
