# GitHub Pages deploy — the per-push preview channel. Every push to
# `main` rebuilds the web bundle and publishes it to
# https://crispstrobe.github.io/CrispMath/ (Pages has no per-day deploy
# cap, unlike Vercel's free tier). Production on Vercel is reserved for
# release tags — see build-web.yml.
#
# Pages serves the site from a repo sub-path, so the build needs
# `--base-href /CrispMath/` (root `/` would break asset URLs). A copy of
# index.html as 404.html gives the Flutter SPA a client-side-routing
# fallback, since Pages has no rewrite rules.
#
# Pages must be set to "GitHub Actions" as its source (Settings → Pages,
# or `gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow`).

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      linux_runner:
        description: 'GitHub-hosted build runner (queue fallback)'
        type: choice
        options: [ubuntu-latest, ubuntu-24.04, macos-latest]
        default: ubuntu-latest

# The deploy-pages action needs these to mint the Pages OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race; keep the most recent push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ${{ inputs.linux_runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Checkout CrispEmbed
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: 11e6d598521976f38081934106b55095b46b40e3
          path: .ci/CrispEmbed

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned in lockstep with ci.yml / build-web.yml.
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get

      - name: Build web (release, dart2js, Pages base-href)
        run: tool/build_web.sh --release --no-wasm-dry-run -O2 --base-href /CrispMath/

      - name: SPA 404 fallback
        run: cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published Pages workflows
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python -m pip install -r tool/browser-requirements.txt
          python -m playwright install --with-deps chromium
          python tool/check_deployed_bundle.py --url "$APP_URL" --source "$GITHUB_SHA"
          python tool/check_notepad_calendar_browser.py --url "$APP_URL" --output deployed-results/calendar.json
          python tool/check_result_evidence_browser.py --url "$APP_URL" --output deployed-results/provenance
          python tool/check_integral_syntax_browser.py --url "$APP_URL" --output deployed-results/integral-syntax
          python tool/check_notepad_batch_browser.py --url "$APP_URL" --output deployed-results/notepad-batch
          python tool/check_notepad_functions_browser.py --url "$APP_URL" --output deployed-results/notepad-functions
          python tool/check_workflow_tasks_browser.py --url "$APP_URL" --output deployed-results/workflow-tasks.json
          python tool/check_workflow_tasks_browser.py --url "$APP_URL" --tasks test/fixtures/fresh_workflow_tasks.json --output deployed-results/fresh-workflow-tasks.json
          for area in algebra numeric workflow; do
            python tool/check_workflow_tasks_browser.py --url "$APP_URL" --tasks "test/fixtures/new_math_${area}_tasks.json" --output "deployed-results/new-math-${area}.json"
          done
          for area in algebra numeric workflow native_safety dependency bound; do
            python tool/check_workflow_tasks_browser.py --url "$APP_URL" --tasks "test/fixtures/round2_${area}_tasks.json" --output "deployed-results/round2-${area}.json"
          done
          for area in algebra numeric; do
            python tool/check_workflow_tasks_browser.py --url "$APP_URL" --tasks "test/fixtures/round3_${area}_tasks.json" --output "deployed-results/round3-${area}.json"
          done
          for area in algebra numeric scope; do
            python tool/check_workflow_tasks_browser.py --url "$APP_URL" --tasks "test/fixtures/round4_${area}_tasks.json" --output "deployed-results/round4-${area}.json"
          done
          for area in algebra numeric scope; do
            python tool/check_workflow_tasks_browser.py --url "$APP_URL" --tasks "test/fixtures/round5_${area}_tasks.json" --output "deployed-results/round5-${area}.json"
          done
          for area in algebra numeric domain scope taylor series_scope variable; do
            python tool/check_workflow_tasks_browser.py --url "$APP_URL" --tasks "test/fixtures/round6_${area}_tasks.json" --output "deployed-results/round6-${area}.json"
          done
          for area in algebra numeric; do
            python tool/check_workflow_tasks_browser.py --url "$APP_URL" --tasks "test/fixtures/round7_${area}_tasks.json" --output "deployed-results/round7-${area}.json"
          done
          for area in algebra numeric; do
            python tool/check_workflow_tasks_browser.py --url "$APP_URL" --tasks "test/fixtures/round8_${area}_tasks.json" --output "deployed-results/round8-${area}.json"
          done
          for area in algebra numeric; do
            python tool/check_workflow_tasks_browser.py --url "$APP_URL" --tasks "test/fixtures/round9_${area}_tasks.json" --output "deployed-results/round9-${area}.json"
          done
          for area in algebra numeric; do
            python tool/check_workflow_tasks_browser.py --url "$APP_URL" --tasks "test/fixtures/round10_${area}_tasks.json" --output "deployed-results/round10-${area}.json"
          done
          python tool/check_apple_workflows_browser.py --url "$APP_URL" --output deployed-results/apple-workflows
          python tool/check_worksheet_export_browser.py --url "$APP_URL" --output deployed-results/worksheet-export
          python tool/check_document_history_browser.py --url "$APP_URL" --output deployed-results/document-history
          python tool/check_cloud_disabled_browser.py --url "$APP_URL" --expected-source "$GITHUB_SHA" --output deployed-results/cloud-disabled
          python tool/check_new_math_browser.py --url "$APP_URL" --expected-source "$GITHUB_SHA" --output deployed-results/new-math-ui
          python tool/check_round2_math_browser.py --url "$APP_URL" --expected-source "$GITHUB_SHA" --output deployed-results/round2-math-ui
          python tool/check_round3_math_browser.py --url "$APP_URL" --expected-source "$GITHUB_SHA" --output deployed-results/round3-math-ui
          python tool/check_round4_math_browser.py --url "$APP_URL" --expected-source "$GITHUB_SHA" --output deployed-results/round4-math-ui
          python tool/check_round5_math_browser.py --url "$APP_URL" --expected-source "$GITHUB_SHA" --output deployed-results/round5-math-ui
          python tool/check_round6_math_browser.py --url "$APP_URL" --expected-source "$GITHUB_SHA" --output deployed-results/round6-math-ui
          python tool/check_round6_statistics_browser.py --url "$APP_URL" --expected-source "$GITHUB_SHA" --output deployed-results/round6-statistics-ui
          python tool/check_round7_math_browser.py --url "$APP_URL" --expected-source "$GITHUB_SHA" --output deployed-results/round7-math-ui
          python tool/check_round8_math_browser.py --url "$APP_URL" --expected-source "$GITHUB_SHA" --output deployed-results/round8-math-ui
          python tool/check_round9_math_browser.py --url "$APP_URL" --expected-source "$GITHUB_SHA" --output deployed-results/round9-math-ui
          python tool/check_round10_math_browser.py --url "$APP_URL" --expected-source "$GITHUB_SHA" --output deployed-results/round10-math-ui
          python tool/check_round5_solve_browser.py --url "$APP_URL" --expected-source "$GITHUB_SHA" --output deployed-results/round5-solve-ui
          python tool/check_handwriting_browser.py --url "$APP_URL" --output deployed-results/handwriting
          python tool/check_fresh_calculations_browser.py --url "$APP_URL" --output deployed-results/fresh-calculations
          python tool/capture_product_gallery.py --url "$APP_URL" --source "$GITHUB_SHA" --output deployed-results/gallery
      - name: Verify all fifty-two eleventh audit questions and guided workflows
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' }}
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          status=0
          for area in algebra numeric supplement; do
            python tool/check_workflow_tasks_browser.py --url "$APP_URL" --tasks "test/fixtures/round11_${area}_tasks.json" --output "deployed-results/round11-${area}.json" || status=1
          done
          python tool/check_round11_math_browser.py --url "$APP_URL" --expected-source "$GITHUB_SHA" --output deployed-results/round11-math-ui || status=1
          python tool/check_guided_worksheet_browser.py --url "$APP_URL" --output deployed-results/guided-worksheet || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-live-results
          path: deployed-results
          if-no-files-found: ignore
          retention-days: 14
