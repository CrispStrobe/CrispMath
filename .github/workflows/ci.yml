name: CrispCalc CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: macos-latest

    steps:
      - name: Checkout CrispCalc
        uses: actions/checkout@v4

      # Clone the sibling CrispEmbed repo as it is a relative path dependency
      - name: Checkout CrispEmbed
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          path: ../CrispEmbed

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # Adjust based on project needs
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Unit & Integration Tests
        run: flutter test

      - name: Build Android App Bundle (Release)
        run: flutter build appbundle --release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Build iOS App (No Sign)
        run: flutter build ios --release --no-codesign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
