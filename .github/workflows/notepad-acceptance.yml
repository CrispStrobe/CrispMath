name: Notepad layout diagnostics

on:
  push:
    branches: [ci/notepad-acceptance-20261110]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notepad-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_SOURCE_BASE: ca24eb34b9b83037aad1be6fc54e3f7623e92aa0
  DIAGNOSTIC_APP_SOURCE: ca24eb34b9b83037aad1be6fc54e3f7623e92aa0

jobs:
  browser:
    name: Observe focused source deletion (${{ matrix.mode }})
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [debug]
    env:
      ACCEPTANCE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify application source and record provenance
        run: |
          git cat-file -e "$APP_SOURCE_BASE^{commit}" || git fetch --no-tags --depth=1 origin "$APP_SOURCE_BASE"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          base = os.environ['APP_SOURCE_BASE']
          workflow_sha = os.environ['GITHUB_SHA']
          expected = '.github/workflows/notepad-acceptance.yml'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == workflow_sha, (head, workflow_sha)
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', base, workflow_sha], text=True).splitlines()
          assert changed == [expected], f'Unexpected changes from the accepted source: {changed}'
          receipt = {
              'appSourceBase': base,
              'diagnostic': True,
              'instrumentation': 'Read-only all-level browser console and pageerror capture; original checker assertions unchanged',
              'workflowSha': workflow_sha,
              'onlyChangedFile': expected,
              'applicationSourceUnchanged': True,
              'mode': os.environ['ACCEPTANCE_MODE'],
              'runnerOS': os.environ['RUNNER_OS'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }
          Path('browser-results').mkdir(exist_ok=True)
          Path('browser-results/source-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt), flush=True)
          PY
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: d28ca2ea43a95934d673d1a54177fdf721614ade
          path: .ci/CrispEmbed
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get
      - name: Build preview
        run: |
          if [[ "$ACCEPTANCE_MODE" == release ]]; then
            tool/build_web.sh --release --no-wasm-dry-run -O2
          else
            tool/build_web.sh --debug --no-wasm-dry-run
          fi
      - name: Install browser test tools
        run: |
          python -m pip install -r tool/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Install read-only console observer
        run: |
          cat > "$RUNNER_TEMP/notepad-console-diagnostics.py" <<'PY_OBSERVER'
          """CI-only console observation for the unchanged reference browser checker.

          No application, DOM, source, result, selection, focus, or assertion is modified.
          The original checker continues to decide whether the actual UI workflow passes.
          """
          import argparse
          import asyncio
          import json
          import os
          from pathlib import Path
          import sys
          import time

          sys.path.insert(0, str(Path.cwd() / 'tool'))
          import check_notepad_references_browser as checker  # noqa: E402


          original_result_actions = checker.result_actions
          traces = {}


          async def observed_result_actions(page, result, profile):
              started = time.perf_counter()
              trace = {'profile': profile, 'startedAt': 'before Use result context menu',
                       'console': [], 'pageErrors': []}
              traces[profile] = trace

              def console(message):
                  trace['console'].append({
                      'atMs': round((time.perf_counter() - started) * 1000, 3),
                      'type': message.type,
                      'text': message.text,
                      'location': message.location,
                  })

              def pageerror(error):
                  trace['pageErrors'].append({
                      'atMs': round((time.perf_counter() - started) * 1000, 3),
                      'name': getattr(error, 'name', None),
                      'message': str(error),
                      'stack': getattr(error, 'stack', None),
                  })

              # Record every console level and full message, including stack frames logged
              # separately from Flutter's initial exception heading. Never intercept input.
              page.on('console', console)
              page.on('pageerror', pageerror)
              await original_result_actions(page, result, profile)


          checker.result_actions = observed_result_actions


          async def main(args):
              output = Path(args.output)
              output.mkdir(parents=True, exist_ok=True)
              provenance = {
                  'driver': 'notepad-console-readonly-v1',
                  'applicationSource': os.environ.get('DIAGNOSTIC_APP_SOURCE'),
                  'workflowSource': os.environ.get('GITHUB_SHA'),
                  'originalCheckerAssertionsUnchanged': True,
                  'applicationStateInjected': False,
                  'focusRepaired': False,
                  'instrumentation': 'read-only browser console and pageerror listeners',
              }
              try:
                  await checker.check(args)
              finally:
                  for profile, trace in traces.items():
                      trace['diagnosticProvenance'] = provenance
                      (output / f'{profile}-console.json').write_text(
                          json.dumps(trace, indent=2) + '\n')
                  report_path = output / 'report.json'
                  if report_path.exists():
                      report = json.loads(report_path.read_text())
                      report['diagnosticProvenance'] = provenance
                      report['consoleArtifacts'] = [f'{profile}-console.json' for profile in traces]
                      report_path.write_text(json.dumps(report, indent=2) + '\n')


          if __name__ == '__main__':
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--url', default='http://127.0.0.1:8766/')
              parser.add_argument('--output', default='browser-results/notepad-console-diagnostics')
              parser.add_argument('--chromium')
              asyncio.run(main(parser.parse_args()))
          PY_OBSERVER
      - name: Start browser preview server
        id: preview
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory build/web > browser-results/http.log 2>&1 &
          curl --fail --silent --show-error --noproxy '*' --retry 30 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:8766/privacy.html > /dev/null
      - name: Stable result references browser acceptance
        id: references
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        continue-on-error: true
        run: python "$RUNNER_TEMP/notepad-console-diagnostics.py" --output browser-results/notepad-references
      - name: Preserve stable result references evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notepad-layout-diagnostics
          path: |
            browser-results/source-receipt.json
            browser-results/http.log
            browser-results/notepad-references
            build/web/build-info.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve original assertion outcome
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          REFERENCES_OUTCOME: ${{ steps.references.outcome }}
        run: |
          printf 'Original reference assertions: %s\n' "$REFERENCES_OUTCOME"
          test "$REFERENCES_OUTCOME" = success
