name: Notepad widget regression acceptance
on:
  push:
    branches: [ci/notepad-acceptance-20261110]
permissions:
  contents: read
concurrency:
  group: notepad-acceptance-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_SOURCE_BASE: da8c6e92a459a5267e2baf1ca1d3fa4884f76ed6
  PRODUCTION_SOURCE_BASE: 63fbffad6e9e292da0c1fa17e5fe2b78c9e92b22
jobs:
  regression:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify unchanged application and exact test correction
        run: |
          for source_ref in "$APP_SOURCE_BASE" "$PRODUCTION_SOURCE_BASE"; do
            git cat-file -e "$source_ref^{commit}" || git fetch --no-tags --depth=1 origin "$source_ref"
          done
          python3 - <<'PY_RECEIPT'
          import json, os, subprocess
          from pathlib import Path
          test_base = os.environ['APP_SOURCE_BASE']
          production = os.environ['PRODUCTION_SOURCE_BASE']
          workflow = os.environ['GITHUB_SHA']
          changed = subprocess.check_output(['git', 'diff', '--name-only', test_base, workflow], text=True).splitlines()
          assert changed == ['.github/workflows/notepad-acceptance.yml'], changed
          test_changes = subprocess.check_output(['git', 'diff', '--name-only', production, test_base], text=True).splitlines()
          assert test_changes == ['test/notepad_screen_test.dart'], test_changes
          receipt = {'applicationSourceBase': production, 'testSourceBase': test_base, 'workflowSha': workflow, 'applicationSourceUnchanged': True, 'onlyWorkflowChange': changed, 'testCorrectionFiles': test_changes, 'testBlob': subprocess.check_output(['git', 'rev-parse', test_base + ':test/notepad_screen_test.dart'], text=True).strip(), 'runnerOS': os.environ['RUNNER_OS'], 'runId': os.environ['GITHUB_RUN_ID']}
          Path('widget-results').mkdir(exist_ok=True)
          Path('widget-results/source-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt), flush=True)
          PY_RECEIPT
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: d28ca2ea43a95934d673d1a54177fdf721614ade
          path: .ci/CrispEmbed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            crispembed:
              path: .ci/CrispEmbed/flutter/crispembed
          YAML
          flutter pub get
      - name: Analyze corrected test source
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee widget-results/analysis.log
      - name: Run complete affected worksheet widget suites
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/notepad_screen_test.dart test/mini_plot_widget_test.dart 2>&1 | tee widget-results/widget-tests.log
      - name: Retain exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notepad-final-widget-regressions
          path: widget-results
          if-no-files-found: error
          retention-days: 7
