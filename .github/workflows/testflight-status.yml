name: Verify internal TestFlight build
on:
  workflow_dispatch:
    inputs:
      build:
        type: string
        default: '12'
        required: true
      version:
        type: string
        default: '1.2.0'
        required: true
      build_source:
        description: 'Source SHA of the successful upload, separate from this verifier checkout'
        type: string
        default: '94556e0023deb0780443f54c9b76cec9b20797f5'
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_SOURCE: ${{ inputs.build_source }}
      BETA_BUILD: ${{ inputs.build }}
      BETA_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies and release-tool unit checks
        run: |
          python -m pip install cryptography
          python -m unittest discover -s tool -p '*_test.py'
      - name: Read processing state and retry internal assignment
        env:
          KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/testflight-key.p8"
          trap 'rm -f "$key_file"' EXIT
          echo "$KEY_BASE64" | base64 --decode > "$key_file"
          python tool/testflight_internal.py --key-file "$key_file" --inspect-only --output processing-state.json
          python tool/testflight_internal.py --key-file "$key_file" --version "$BETA_VERSION" --build "$BETA_BUILD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-testflight-status
          path: |
            processing-state.json
            testflight-evidence.json
